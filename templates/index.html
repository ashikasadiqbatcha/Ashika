<!DOCTYPE html>
<html>
<head>
    <title>FitBuddy AI</title>
    <style>
        body { font-family: 'Roboto', sans-serif; background: url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=2070') no-repeat center/cover; margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center; }
        .container { background: rgba(255,255,255,0.95); padding: 30px; border-radius: 15px; width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        h1 { text-align:center; color:#0072ff; }
        label { font-weight:bold; margin-top:10px; display:block; }
        input, select { width:100%; padding:10px; margin:5px 0 15px 0; border-radius:8px; border:1px solid #ccc; }
        button { width:100%; padding:12px; background: linear-gradient(to right, #00c6ff, #0072ff); border:none; color:white; font-size:16px; border-radius:8px; cursor:pointer; }
        button:hover { opacity:0.9; }
    </style>
</head>
<body>
<div class="container">
    <h1>FitBuddy AI 💪</h1>
    <p style="text-align:center;">Enter your details to generate plan</p>
    <form action="/generate-workout" method="post">
        <label>Name</label>
        <input type="text" name="username" required>
        <label>User ID</label>
        <input type="number" name="user_id" required>
        <label>Age</label>
        <input type="number" name="age" required>
        <label>Weight (kg)</label>
        <input type="number" step="0.1" name="weight" required>
        <label>Fitness Goal</label>
        <select name="goal" required>
            <option value="weight loss">Weight Loss</option>
            <option value="muscle gain">Muscle Gain</option>
            <option value="general fitness">General Fitness</option>
            <option value="flexibility">Flexibility</option>
        </select>
        <label>Workout Intensity</label>
        <select name="intensity" required>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
        </select>
        <button type="submit">Generate Plan 🚀</button>
    </form>
    <div style="text-align:center; margin-top:15px;"><a href="/view-all-users">View All Users</a></div>
</div>
</body>
</html>
